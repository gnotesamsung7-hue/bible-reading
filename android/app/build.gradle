plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.markdave.biblejourney'
    compileSdk 34

    defaultConfig {
        applicationId 'com.markdave.biblejourney'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // A fixed key, so each new APK installs over the old one and keeps your progress.
    signingConfigs {
        release {
            storeFile file('biblejourney.keystore')
            storePassword 'biblejourney'
            keyAlias 'biblejourney'
            keyPassword 'biblejourney'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
