<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEE9">
<title>Bible Journey</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2326304B'/%3E%3Crect x='16' y='12' width='32' height='40' rx='3' fill='%23F5F3EC'/%3E%3Crect x='16' y='46' width='32' height='6' fill='%23D8B159'/%3E%3Cpath d='M38 12h6v22l-3-3-3 3z' fill='%23C9505F'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EDEEE9; --surface:#FAFAF7; --raised:#FFFFFF; --ink:#1E2333; --muted:#5B6170; --line:#D4D6CD;
  --gilt:#A87A1F; --gilt-hi:#D9B866; --edge-empty:#DFDED4; --on-gilt:#FFFFFF; --ribbon:#8C2232;
  --primary:#26304B; --on-primary:#F5F3EC; --danger:#9B2C2C;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Noto Serif","Droid Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --rfont:19px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161C; --surface:#1C1F27; --raised:#242834; --ink:#ECE8DD; --muted:#A3A7B3; --line:#313544;
    --gilt:#D8B159; --gilt-hi:#F0D48E; --edge-empty:#2B2F3B; --on-gilt:#1A1C22; --ribbon:#CF5868;
    --primary:#D8B159; --on-primary:#1A1C22; --danger:#E07272; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1C1F27; --raised:#242834; --ink:#ECE8DD; --muted:#A3A7B3; --line:#313544;
  --gilt:#D8B159; --gilt-hi:#F0D48E; --edge-empty:#2B2F3B; --on-gilt:#1A1C22; --ribbon:#CF5868;
  --primary:#D8B159; --on-primary:#1A1C22; --danger:#E07272; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:20px 18px 96px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.top{margin:6px 0 18px}
.top .hello{color:var(--muted);font-size:15px;margin-bottom:2px}
.top .sub{color:var(--muted);margin-top:4px}
.back{background:none;border:0;color:var(--gilt);padding:8px 0;margin:-8px 0 4px;font-weight:600}

/* page-edge progress: the whole Bible as gilt page edges, one slice per book */
.edge{margin:0 0 22px}
.edge-figure{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.edge-figure .big{font-family:var(--serif);font-size:56px;line-height:1;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.edge-figure .small{color:var(--muted);font-size:15px}
.edge svg{display:block;width:100%;height:64px;border-radius:6px 6px 3px 3px;background:var(--edge-empty)}
.edge .split{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:16px}
.card.today::after{content:"";position:absolute;top:-1px;right:24px;width:16px;height:46px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.today .sub{color:var(--muted);margin-top:4px;font-size:15px}
.grp{margin-top:16px}
.grp h3{font-size:16px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{min-width:46px;height:46px;padding:0 10px;border-radius:23px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-variant-numeric:tabular-nums}
.ch.on{background:var(--gilt);border-color:var(--gilt);color:var(--on-gilt)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1px solid transparent;border-radius:10px;padding:12px 18px;font-weight:600;min-height:48px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:0 10px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0;padding-left:0}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:2px 0 0;font-family:var(--serif);font-size:20px;font-weight:600;font-variant-numeric:lining-nums}
.pace{color:var(--muted);font-size:15px;margin-bottom:22px}
.notice{background:var(--surface);border:1px solid var(--ribbon);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.notice .btn{margin-top:10px}
.votd{margin:8px 0 0;padding:4px 0 0 18px;border-left:3px solid var(--gilt)}
.votd blockquote{margin:0;font-family:var(--serif);font-size:19px;line-height:1.55}
.votd figcaption{color:var(--muted);font-size:14px;margin-top:6px}

.seg{display:flex;background:var(--edge-empty);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 8px;font-weight:600;color:var(--muted);min-height:44px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.books{list-style:none;margin:0;padding:0}
.book{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.book .bn{font-family:var(--serif);font-size:18px;font-weight:600}
.book .bc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;align-self:center}
.book .bar{grid-column:1/-1;height:4px;background:var(--edge-empty);border-radius:2px;overflow:hidden;margin-top:6px}
.book .bar i{display:block;height:100%;background:var(--gilt)}
.book.done .bc{color:var(--gilt);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:4px}
.grid .ch{width:100%;padding:0}
.fine{color:var(--muted);font-size:14px;margin-top:12px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;font-variant-numeric:lining-nums}
.stat span{color:var(--muted);font-size:14px}
.section{margin:22px 0 10px}
.tbar{margin-bottom:12px}
.tbar .lbl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.tbar .lbl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.tbar .track{height:10px;border-radius:5px;background:var(--edge-empty);overflow:hidden}
.tbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gilt),var(--gilt-hi))}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;background:var(--gilt);border-radius:4px 4px 0 0;min-height:2px}
.bars i.zero{background:var(--edge-empty)}
.bars em{font-style:normal;font-size:11px;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
.bars-x{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.heat i{width:100%;aspect-ratio:1;min-width:14px;border-radius:3px;background:var(--edge-empty)}
.heat i.l1{background:color-mix(in srgb,var(--gilt) 40%,var(--edge-empty))}
.heat i.l2{background:color-mix(in srgb,var(--gilt) 70%,var(--edge-empty))}
.heat i.l3{background:var(--gilt)}
.heat i.fut{background:transparent}

.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.set h3{font-family:var(--sans);font-size:16px;font-weight:600}
.set p{color:var(--muted);font-size:14px}
.set .act{flex:none}
.set-block{padding:16px 0;border-bottom:1px solid var(--line)}
.set-block h3{font-family:var(--sans);font-size:16px;font-weight:600;margin-bottom:10px}
.set-block p{color:var(--muted);font-size:14px}
.set-block .seg{margin:0}
.link{background:none;border:0;color:var(--gilt);font-weight:600;padding:10px 0}
.switch{position:relative;display:inline-block;width:52px;height:30px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--edge-empty);border:1px solid var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--gilt);border-color:var(--gilt)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:2px solid var(--gilt);outline-offset:2px}
input[type=time],input[type=date],select,.field input[type=text],.field input:not([type]){background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%}
input[type=range]{width:100%;accent-color:var(--gilt)}
.credit{text-align:center;color:var(--muted);font-size:14px;padding:26px 0 8px}
.credit strong{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:2px}

/* setup */
.setup{padding-top:12px}
.setup .edge svg{height:44px}
.setup-title{font-size:34px;margin:8px 0 12px;line-height:1.15}
.lede{color:var(--muted);font-size:17px;max-width:34em;margin-bottom:22px}
.field{display:block;border:0;margin:0 0 20px;padding:0}
.field>span,.field legend{display:block;font-weight:600;margin-bottom:8px;padding:0}
.opt{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);cursor:pointer}
.opt input{grid-row:1/span 2;width:20px;height:20px;margin:0;accent-color:var(--gilt)}
.opt .opt-t{font-weight:600}
.opt .opt-s{color:var(--muted);font-size:14px}
.opt:has(input:checked){border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.date{margin-top:4px}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:560px;margin:0 auto;display:flex}
#tabs button{flex:1;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;min-height:58px}
#tabs svg{width:24px;height:24px}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"] svg{color:var(--gilt)}

/* reader */
.reader{position:fixed;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column}
.r-head{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;border-bottom:1px solid var(--line);background:var(--surface)}
.r-head .t{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{background:none;border:0;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:18px;font-weight:600}
.icon:disabled{opacity:.3}
.icon svg{width:22px;height:22px}
.r-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.r-text{max-width:36em;margin:0 auto;padding:26px 22px 40px;font-family:var(--serif);font-size:var(--rfont);line-height:1.7}
.r-text h2{font-size:1.5em;margin-bottom:.9em;font-weight:600}
.r-text h2 span{color:var(--gilt)}
.r-text p{margin:0 0 .55em}
.r-text sup{font-family:var(--sans);font-size:.6em;color:var(--gilt);font-weight:700;margin-right:.35em;vertical-align:.45em;line-height:0}
.r-text .src{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:2em}
.r-foot{border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--surface)}
.r-foot .in{max-width:36em;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.r-foot .row{margin:0}
.r-foot .row .btn{flex:1}
.r-foot .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.r-foot .meta button{background:none;border:0;color:var(--gilt);font-weight:600;padding:6px 0}
.loading{color:var(--muted);font-family:var(--sans);font-size:15px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(10,12,18,.45);opacity:0;transition:opacity .2s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(100%);transition:transform .22s ease-out}
.sheet-panel>div{max-width:520px;margin:0 auto}
.sheet.open .scrim{opacity:1}
.sheet.open .sheet-panel{transform:none}
.sheet h2{margin-bottom:8px}
.sheet .lede{font-size:16px;margin-bottom:16px}
.qr{background:#fff;border-radius:14px;padding:14px;width:min(260px,70vw);margin:8px auto 10px}
.qr svg{display:block;width:100%;height:auto}
.qr-url{text-align:center;color:var(--muted);font-size:13px;word-break:break-all}
.cert-prev{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:6px 0 4px}

/* version switch + NIV */
.vseg{display:inline-flex;background:var(--edge-empty);border-radius:10px;padding:3px;margin:0 0 18px;font-family:var(--sans)}
.vseg button{border:0;background:none;border-radius:8px;padding:6px 16px;font-weight:700;font-size:14px;color:var(--muted);min-height:36px}
.vseg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.niv-card{font-family:var(--sans);font-size:16px;line-height:1.5;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:4px}
.niv-card p{margin:0 0 14px;color:var(--muted)}
.niv-card .btn{width:100%}
/* recording */
.r-mid{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.reader.cam .r-text{padding-bottom:170px}
.rec-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--ribbon);color:#fff;font-weight:600;font-size:15px}
.rec-bar .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
.rec-bar.paused .dot{animation:none;opacity:.45}
.rec-bar .tm{flex:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-bar button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:8px 12px;font-weight:600;min-height:38px}
@keyframes blink{50%{opacity:.2}}
.rec-cam{position:absolute;right:12px;bottom:12px;width:100px;height:134px;object-fit:cover;border-radius:12px;border:2px solid var(--surface);box-shadow:0 2px 12px rgba(0,0,0,.3);transform:scaleX(-1);background:#000;z-index:2}
.choice{display:grid;gap:10px;margin:6px 0 4px}
.choice button{display:flex;gap:14px;align-items:center;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:64px}
.choice svg{width:28px;height:28px;flex:none;color:var(--gilt)}
.choice b{display:block;font-size:16px}
.choice span span{color:var(--muted);font-size:14px}
.recs{list-style:none;margin:8px 0 0;padding:0}
.recs button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.recs svg{width:22px;height:22px;flex:none;color:var(--gilt)}
.recs b{display:block;font-family:var(--serif);font-size:17px}
.recs small{color:var(--muted);font-size:13px}
.player{width:100%;border-radius:12px;background:#000;margin:8px 0;max-height:60vh}
audio.player{background:none}
/* group */
.gcard{margin:0 0 26px}
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.ghead p{color:var(--muted);font-size:14px}
.code{font-family:var(--serif);font-weight:600;letter-spacing:.14em;font-variant-numeric:lining-nums}
.gcode{font-size:44px;text-align:center;margin:4px 0 2px}
.mem{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.mem .mn{font-family:var(--serif);font-size:18px;font-weight:600}
.mem .mp{font-family:var(--serif);font-size:20px;font-weight:600;align-self:center;font-variant-numeric:lining-nums}
.mem .bar{grid-column:1/-1;height:4px;background:var(--edge-empty);border-radius:2px;overflow:hidden;margin:6px 0 4px}
.mem .bar i{display:block;height:100%;background:var(--gilt)}
.mem .ms{grid-column:1/-1;color:var(--muted);font-size:14px}
.mem .ms.warn{color:var(--ribbon);font-weight:600}
.tag{font-family:var(--sans);font-style:normal;font-size:12px;font-weight:700;color:var(--gilt);border:1px solid var(--gilt);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:3px}
.gfoot{display:flex;flex-wrap:wrap;gap:4px 18px}
.mini-edge svg{display:block;width:100%;height:40px;border-radius:5px;background:var(--edge-empty);margin:8px 0 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:min(90vw,420px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<nav id="tabs" hidden aria-label="Sections"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M15 3v8l-2-1.6L11 11V3"/></svg>Today</button>

const plural=(n,w)=>`${n.toLocaleString()} ${w}${n===1?'':'s'}`;

/* ---------- state ---------- */
const KEY='bibleJourney.v1';
/* Group sharing server: paste your Firebase Realtime Database URL between the quotes,
   for example 'https://bible-journey-default-rtdb.asia-southeast1.firebasedatabase.app' */
const SYNC_URL='https://bible-journey-837f9-default-rtdb.asia-southeast1.firebasedatabase.app';
const SYNC=SYNC_URL.replace(/\/+$/,'');
const defaults=()=>({name:'',plan:null,began:null,read:{},theme:'auto',font:19,tr:'1',ver:'KJV',reminder:{on:false,time:'06:00'},completedOn:null,tickMode:'tick'});
let S=null;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object')S=Object.assign(defaults(),raw);}catch(e){}
if(!S)S=defaults();
const rid=n=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let o='';const r=crypto.getRandomValues(new Uint32Array(n));for(const x of r)o+=a[x%a.length];return o;};
if(!S.uid){S.uid=rid(14);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
if(!Array.isArray(S.groups))S.groups=[];
if(S.ver!=='NIV')S.ver='KJV';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Couldn’t save progress on this device');}queuePush();}

const key=i=>FLAT[i][0]+'.'+FLAT[i][1];
const isRead=i=>!!S.read[key(i)];
const chName=i=>BOOKS[FLAT[i][0]][0]+' '+FLAT[i][1];
function readCount(){let n=0;for(let i=0;i<TOTAL;i++)if(S.read[key(i)])n++;return n;}
function bookCount(bi){let n=0;for(let c=1;c<=BOOKS[bi][2];c++)if(S.read[bi+'.'+c])n++;return n;}
const doneBooks=()=>range(0,66).filter(b=>bookCount(b)===BOOKS[b][2]);
function dayCounts(){const m={};for(const v of Object.values(S.read)){if(v&&v!==BEFORE)m[v]=(m[v]||0)+1;}return m;}
function streak(m){m=m||dayCounts();let d=today();if(!m[d])d=addDays(d,-1);let n=0;while(m[d]){n++;d=addDays(d,-1);}return n;}
function bestStreak(m){const ds=Object.keys(m).sort();let best=0,run=0,prev=null;for(const d of ds){run=(prev&&diffDays(prev,d)===1)?run+1:1;best=Math.max(best,run);prev=d;}return best;}

/* ---------- plan ---------- */
function orderIdx(order){return order==='nt-first'?range(OT_CH,TOTAL).concat(range(0,OT_CH)):range(0,TOTAL);}
function todayPlan(){
  const t=today(), order=S.plan.order;
  const un=i=>{const r=S.read[key(i)];return !r||r>=t;};  // unread when the day began
  let rem=0;for(let i=0;i<TOTAL;i++)if(un(i))rem++;
  const overdue=diffDays(t,S.plan.end)<0;
  const daysLeft=Math.max(1,diffDays(t,S.plan.end)+1);
  const target=rem?Math.max(1,Math.round(rem/daysLeft)):0;
  let list=[];
  if(target){
    if(order==='parallel'){
      const ot=[],nt=[];for(let i=0;i<TOTAL;i++)if(un(i))(i<OT_CH?ot:nt).push(i);
      let kn=Math.round(target*nt.length/(ot.length+nt.length));
      if(nt.length&&ot.length&&target>1&&kn<1)kn=1;
      kn=Math.min(kn,nt.length);const ko=Math.min(ot.length,target-kn);kn=Math.min(nt.length,target-ko);
      list=ot.slice(0,ko).concat(nt.slice(0,kn));
    }else{for(const i of orderIdx(order)){if(un(i)){list.push(i);if(list.length>=target)break;}}}
  }
  return {list,target,rem,daysLeft,overdue};
}
function pace(){
  const t=today(),total=diffDays(S.plan.start,S.plan.end)+1;
  const el=Math.max(0,Math.min(total,diffDays(S.plan.start,t)));
  let base=0,before=0;
  for(const v of Object.values(S.read)){if(v===BEFORE||v<S.plan.start)base++;if(v<t)before++;}
  return before-(base+(TOTAL-base)*el/total);
}
function nextUnread(){for(const i of orderIdx(S.plan?S.plan.order:'canonical'))if(!isRead(i))return i;return 0;}
function groups(list){
  const g=[];
  for(const i of list){const b=FLAT[i][0],last=g[g.length-1];
    if(last&&last.b===b&&FLAT[last.items[last.items.length-1]][1]+1===FLAT[i][1])last.items.push(i);else g.push({b,items:[i]});}
  return g;
}

/* ---------- marking ---------- */
function commit(indices,on){
  const wasBooks=new Set(doneBooks()), tp=todayPlan();
  const wasToday=tp.list.length&&tp.list.every(isRead), wasAll=readCount()===TOTAL;
  indices.forEach(i=>{if(on){if(!S.read[key(i)])S.read[key(i)]=today();}else delete S.read[key(i)];});
  if(on){
    if(readCount()===TOTAL&&!wasAll){S.completedOn=today();save();render();celebrate('all');return;}
    save();render();
    const fresh=doneBooks().filter(b=>!wasBooks.has(b));
    const tp2=todayPlan(),nowToday=tp2.list.length&&tp2.list.every(isRead);
    if(fresh.length===1)celebrate('book',fresh[0],!wasToday&&nowToday);
    else if(!wasToday&&nowToday)celebrate('today');
  }else{if(S.completedOn&&readCount()<TOTAL)S.completedOn=null;save();render();}
}

/* ---------- views ---------- */
let tab='today',bookOpen=null,testament='ot';
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening';}
function fmtPct(p){if(p>=100)return '100%';if(p>0&&p<1)return p.toFixed(1)+'%';return Math.floor(p)+'%';}

function pageEdge(counts){
  let x=0,out='';
  BOOKS.forEach((b,bi)=>{
    const w=b[2],f=Math.min(1,(counts?(+counts[bi]||0):bookCount(bi))/w),h=64*f;
    if(f>0)out+=`<rect x="${x}" y="${(64-h).toFixed(2)}" width="${Math.max(w-1.2,.8)}" height="${h.toFixed(2)}" fill="url(#gilt)"/>`;
    out+=`<rect x="${x+w-1.2}" y="0" width="1.2" height="64" fill="var(--bg)" opacity=".55"/>`;
    x+=w;
  });
  return `<svg viewBox="0 0 ${TOTAL} 64" preserveAspectRatio="none" role="img" aria-label="Progress through all 66 books"><defs><linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gilt-hi)"/><stop offset="1" stop-color="var(--gilt)"/></linearGradient></defs>${out}<rect x="${OT_CH-0.6}" y="0" width="2" height="64" fill="var(--ribbon)"/></svg>`;
}
function edgeBlock(){
  const rc=readCount();
  return `<section class="edge"><div class="edge-figure"><span class="big">${fmtPct(rc/TOTAL*100)}</span><span class="small">${rc.toLocaleString()} of 1,189 chapters read</span></div>${pageEdge()}<div class="split"><span>Old Testament</span><span>New Testament</span></div></section>`;
}

  <p class="lede">Pick a finish date. Bible Journey works out how many chapters to read each day and keeps you on pace, even after a missed day.</p>
  <label class="field"><span>Your name</span><input type="text" id="su-name" autocomplete="given-name" placeholder="Shown on your certificate" maxlength="40" value="${esc(S.name||'')}"></label>
  <fieldset class="field"><legend>Finish in</legend>
  ${PLANS.concat([['custom','Pick a date']]).map(([v,l])=>`<label class="opt"><input type="radio" name="su-plan" value="${v}"${v==='365'?' checked':''}><span class="opt-t">${l}</span><span class="opt-s">${v==='custom'?'Choose your own finish date':rateText(TOTAL,+v)}</span></label>`).join('')}
  <input type="date" id="su-date" class="date" min="${addDays(t,6)}" value="${addDays(t,364)}" hidden aria-label="Finish date">
  </fieldset>
  <fieldset class="field"><legend>Reading order</legend>

  </fieldset>
  <fieldset class="field"><legend>Bible version</legend>
  ${[['KJV','King James Version (KJV)','Built into the app, works offline'],['NIV','New International Version (NIV)','Opens from YouVersion, needs internet']].map(([v,l,d])=>`<label class="opt"><input type="radio" name="su-ver" value="${v}"${v===S.ver?' checked':''}><span class="opt-t">${l}</span><span class="opt-s">${d}</span></label>`).join('')}
  <p class="fine">You can switch any time while reading.</p>
  </fieldset>
  <button class="btn primary wide" data-act="start">Start reading</button>
  <p class="fine">Already partway through? After you start, open Books and mark the books you’ve already read.</p>
  </div>`;
}

function vToday(){
  const rc=readCount();
  let h=`<header class="top"><p class="hello">${greet()}${S.name?', '+esc(S.name):''}</p><h1>Bible Journey</h1></header>${edgeBlock()}`;
  if(rc===TOTAL){
    return h+`<section class="card today"><h2>You’ve read the whole Bible</h2><p class="sub">Finished ${S.completedOn?fmtDate(S.completedOn):''}. All 66 books, all 1,189 chapters.</p><div class="row"><button class="btn primary" data-act="cert">View your certificate</button><button class="btn ghost" data-act="again">Start a new journey</button></div></section>`+votdBlock();
  }
  const tp=todayPlan(),n=tp.list.length,done=tp.list.filter(isRead).length;
  if(tp.overdue)h+=`<div class="notice"><p>Your finish date of ${fmtDate(S.plan.end)} has passed. Today shows everything that’s left, so set a new date to spread it out again.</p><button class="btn primary" data-act="plan">Set a new finish date</button></div>`;
  const gs=groups(tp.list), first=tp.list.find(i=>!isRead(i));
  h+=`<section class="card today"><h2>Today’s reading</h2>
    <p class="sub">${done===n?'All done for today. Well done.':`${done} of ${plural(n,'chapter')} done`}</p>
    ${gs.map(g=>`<div class="grp"><h3>${BOOKS[g.b][0]}</h3><div class="chips">${g.items.map(i=>`<button class="ch${isRead(i)?' on':''}" data-act="read" data-q="today" data-i="${i}" aria-label="${chName(i)}${isRead(i)?', read':''}">${FLAT[i][1]}</button>`).join('')}</div></div>`).join('')}
    <div class="row">${first!==undefined?`<button class="btn primary" data-act="read" data-q="today" data-i="${first}">${done?'Continue reading':'Start reading'}</button><button class="btn ghost" data-act="markToday">Mark all as read</button>`:`<button class="btn ghost" data-act="read" data-i="${nextUnread()}">Read ahead</button>`}</div>
  </section>`;
  const st=streak(),p=pace(),pr=Math.round(Math.abs(p));
  h+=`<dl class="facts"><div><dt>Streak</dt><dd>${plural(st,'day')}</dd></div><div><dt>Days left</dt><dd>${tp.overdue?0:tp.daysLeft}</dd></div><div><dt>Finish by</dt><dd>${fmtDate(S.plan.end,{month:'short',day:'numeric'})}</dd></div></dl>`;
  h+=`<p class="pace">${pr<1?'Right on pace for your finish date.':p<0?`${plural(pr,'chapter')} behind your plan. Today’s reading already includes a bit of catch-up.`:`${plural(pr,'chapter')} ahead of your plan.`}</p>`;
  return h+votdBlock();
}
function votdBlock(){return `<figure class="votd" id="votd" hidden></figure>`;}
function fillVotd(){
  const el=$('#votd');if(!el)return;
  const v=VOTD[Math.floor(utc(today())/864e5)%VOTD.length];
  getKJV().then(d=>{const t=d[v[0]][v[1]-1][v[2]-1];const e=$('#votd');if(!e||!t)return;e.innerHTML=`<blockquote>“${esc(t)}”</blockquote><figcaption>${v[0]===18?'Psalm':BOOKS[v[0]][0]} ${v[1]}:${v[2]} (KJV)</figcaption>`;e.hidden=false;}).catch(()=>{});
}

function vBooks(){
  if(bookOpen!==null)return vBook(bookOpen);
  const list=testament==='ot'?range(0,OT_END):range(OT_END,66);
  return `<header class="top"><h1>Books</h1><p class="sub">${plural(doneBooks().length,'book')} finished of 66</p></header>
  <div class="seg" role="tablist"><button role="tab" aria-selected="${testament==='ot'}" data-act="testament" data-v="ot">Old Testament</button><button role="tab" aria-selected="${testament==='nt'}" data-act="testament" data-v="nt">New Testament</button></div>
  <ul class="books">${list.map(bi=>{const n=bookCount(bi),t=BOOKS[bi][2];return `<li><button class="book${n===t?' done':''}" data-act="book" data-b="${bi}"><span class="bn">${BOOKS[bi][0]}</span><span class="bc">${n===t?'Finished':n+' / '+t}</span><span class="bar"><i style="width:${(n/t*100).toFixed(1)}%"></i></span></button></li>`;}).join('')}</ul>`;
}
function vBook(bi){
  const t=BOOKS[bi][2],n=bookCount(bi),open=S.tickMode==='open';
  const fu=range(OFF[bi],OFF[bi]+t).find(i=>!isRead(i));
  return `<header class="top"><button class="back" data-act="bookBack">‹ All books</button><h1>${BOOKS[bi][0]}</h1><p class="sub">${n} of ${plural(t,'chapter')} read</p></header>
  <div class="seg" role="group" aria-label="When you tap a chapter"><button aria-pressed="${!open}" data-act="tickMode" data-v="tick">Tap to tick off</button><button aria-pressed="${open}" data-act="tickMode" data-v="open">Tap to read</button></div>
  <div class="grid">${range(1,t+1).map(c=>{const i=OFF[bi]+c-1;return `<button class="ch${isRead(i)?' on':''}" data-act="${open?'read':'tick'}" data-i="${i}" aria-label="Chapter ${c}${isRead(i)?', read':''}">${c}</button>`;}).join('')}</div>
  <div class="row"><button class="btn primary" data-act="read" data-i="${fu!==undefined?fu:OFF[bi]}">${fu===undefined?'Read from chapter 1':'Read chapter '+FLAT[fu][1]}</button>
  ${n<t?`<button class="btn ghost" data-act="bookBefore" data-b="${bi}">I’ve read this book before</button>`:`<button class="btn ghost" data-act="bookClear" data-b="${bi}">Clear this book</button>`}</div>
  <p class="fine">${open?'Tap a chapter to open it.':'Tap a chapter to tick it off or untick it.'} Use “I’ve read this book before” for books you finished before starting here. Those don’t count toward your streak.</p>`;
}

function vProgress(){
  const rc=readCount(),m=dayCounts(),st=streak(m),best=bestStreak(m),t=today();
  let ot=0;for(let i=0;i<OT_CH;i++)if(isRead(i))ot++;const nt=rc-ot;
  const days=range(0,14).map(n=>addDays(t,n-13)),cnt=days.map(d=>m[d]||0),sum=cnt.reduce((a,b)=>a+b,0),mx=Math.max(1,...cnt);
  const active=Object.keys(m).sort(),first=active[0];
  const span=first?Math.min(14,Math.max(1,diffDays(first,t)+1)):14;
  const avg=sum/span,left=TOTAL-rc;
  let proj='';
  if(left===0)proj='You’ve read every chapter.';
  else if(avg>0)proj=`At your recent pace (${avg.toFixed(1)} chapters a day), you’d finish around ${fmtDate(addDays(t,Math.ceil(left/avg)))}.`;
  else proj='Read a chapter to see when you’re likely to finish.';
  // heatmap: 16 weeks, Sunday-first columns
  const end=addDays(t,6-parse(t).getDay()),start=addDays(end,-16*7+1);
  let heat='';for(let n=0;n<16*7;n++){const d=addDays(start,n),c=m[d]||0;heat+=d>t?'<i class="fut"></i>':`<i class="${c===0?'':c<3?'l1':c<6?'l2':'l3'}" title="${fmtDate(d)}: ${plural(c,'chapter')}"></i>`;}
  return `<header class="top"><h1>Progress</h1></header>
  <div class="stats">
    <div class="stat"><b>${rc.toLocaleString()}</b><span>chapters read</span></div>
    <div class="stat"><b>${doneBooks().length}</b><span>books finished</span></div>
    <div class="stat"><b>${st}</b><span>day streak</span></div>
    <div class="stat"><b>${best}</b><span>best streak</span></div>
  </div>
  <p class="pace">${proj}</p>
  <h2 class="section">Old and New Testament</h2>
  <div class="tbar"><div class="lbl"><span>Old Testament</span><span>${ot} / ${OT_CH}</span></div><div class="track"><i style="width:${(ot/OT_CH*100).toFixed(1)}%"></i></div></div>
  <div class="tbar"><div class="lbl"><span>New Testament</span><span>${nt} / ${TOTAL-OT_CH}</span></div><div class="track"><i style="width:${(nt/(TOTAL-OT_CH)*100).toFixed(1)}%"></i></div></div>
  <h2 class="section">Last 14 days</h2>
  <div class="bars" role="img" aria-label="Chapters read each day for the last 14 days">${cnt.map(c=>`<div>${c?`<em>${c}</em>`:''}<i class="${c?'':'zero'}" style="height:${c?Math.max(4,c/mx*100):2}%"></i></div>`).join('')}</div>
  <div class="bars-x"><span>${fmtDate(days[0],{month:'short',day:'numeric'})}</span><span>Today</span></div>
  <h2 class="section">Reading days</h2>
  <div class="heat" role="img" aria-label="Days you read over the last 16 weeks">${heat}</div>
  <p class="fine">Darker squares mean more chapters that day.</p>`;
}

  <div class="set"><div><h3>Start over</h3><p>Clear every chapter and set up a new plan.</p></div><button class="link act" style="color:var(--danger)" data-act="reset">Reset</button></div>
  <div class="credit"><strong>All Glory to God</strong>Bible text: King James Version (public domain)<br>${esc(ver)}</div>`;
}

const app=$('#app');
function render(){
  applyTheme();
  if(!S.plan){app.innerHTML=vSetup();$('#tabs').hidden=true;return;}
  $('#tabs').hidden=false;
  app.innerHTML=({today:vToday,books:vBooks,progress:vProgress,group:vGroup,more:vMore})[tab]();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  if(tab==='today')fillVotd();
  if(tab==='group')loadGroups();
}
function go(t){tab=t;bookOpen=null;render();window.scrollTo(0,0);}

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  r.style.setProperty('--rfont',S.font+'px');
  const bg=getComputedStyle(r).getPropertyValue('--bg').trim();
  const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=bg;
  if(APP){try{AndroidApp.setBarColor(bg);}catch(e){}}
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme();});}catch(e){}

/* ---------- Bible text ---------- */
let kjvP=null;
function getKJV(){
  if(window.KJV_DATA)return Promise.resolve(window.KJV_DATA);
  if(!kjvP)kjvP=fetch('kjv.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).catch(e=>{kjvP=null;throw e;});
  return kjvP;
}
const yvUrl=i=>`https://www.bible.com/bible/${S.tr}/${BOOKS[FLAT[i][0]][1]}.${FLAT[i][1]}`;
function openUrl(u){if(APP){try{AndroidApp.openUrl(u);return;}catch(e){}}window.open(u,'_blank','noopener');}

/* ---------- reader ---------- */
const R={i:0,q:null};
function openReader(i,q){R.i=i;R.q=q||null;$('#reader').hidden=false;document.body.classList.add('noscroll');renderReader();if(S.ver==='NIV'&&APP&&!isRead(i))openNiv(i);}
const nivUrl=i=>`https://www.bible.com/bible/111/${BOOKS[FLAT[i][0]][1]}.${FLAT[i][1]}.NIV`;
function openNiv(i){
  if(APP){try{AndroidApp.showNiv(nivUrl(i),chName(i)+' (NIV)',!isRead(i));return;}catch(e){}}
  const w=window.open(nivUrl(i),'_blank','noopener');if(!w)toast('Allow pop-ups to open the NIV');
}
/* called by the Android NIV viewer */
window.onNivMark=function(){
  if($('#reader').hidden||isRead(R.i))return;
  const prev=R.i;act('rMark',{dataset:{}});
  if(!$('#reader').hidden&&$('#sheet').hidden&&R.i!==prev&&S.ver==='NIV'&&!isRead(R.i))setTimeout(()=>openNiv(R.i),250);
};
window.onNivClosed=function(){if(!$('#reader').hidden)renderFoot();};
function closeReader(){if(REC.mr)stopRec();$('#reader').hidden=true;document.body.classList.remove('noscroll');}
function queueNext(){
  if(R.q){const p=R.q.indexOf(R.i);for(let j=p+1;j<R.q.length;j++)if(!isRead(R.q[j]))return R.q[j];for(let j=0;j<p;j++)if(!isRead(R.q[j]))return R.q[j];return null;}
  return R.i+1<TOTAL?R.i+1:null;
}
function renderReader(){
  const i=R.i,[b,c]=FLAT[i];
  if(REC.mr&&!REC.chapters.includes(i))REC.chapters.push(i);
  $('#rTitle').textContent=BOOKS[b][0]+' '+c;
  document.querySelector('[data-act=rPrev]').disabled=i===0;
  document.querySelector('[data-act=rNext]').disabled=i===TOTAL-1;
  const body=$('#rBody');
  const vseg=`<div class="vseg" role="group" aria-label="Bible version">${['KJV','NIV'].map(v=>`<button aria-pressed="${S.ver===v}" data-act="ver" data-v="${v}">${v}</button>`).join('')}</div>`;
  if(S.ver==='NIV'){
    body.innerHTML=`<article class="r-text">${vseg}<h2>${esc(BOOKS[b][0])} <span>${c}</span></h2><div class="niv-card"><p>The NIV opens from YouVersion (bible.com), which is licensed to publish it. It needs an internet connection.${APP?' Tap Mark as read at the top when you finish.':' Come back here and tap Mark as read when you finish.'}</p><button class="btn primary" data-act="niv">Read ${esc(BOOKS[b][0])} ${c} in NIV</button></div><p class="src">New International Version, via YouVersion</p></article>`;
    body.scrollTop=0;renderFoot();return;
  }
  body.innerHTML=`<div class="r-text">${vseg}<p class="loading">Opening ${esc(BOOKS[b][0])} ${c}…</p></div>`;
  getKJV().then(d=>{
    if(R.i!==i)return;
    const vs=d[b][c-1];
    if(S.ver!=='KJV')return;
    body.innerHTML=`<article class="r-text">${vseg}<h2>${esc(BOOKS[b][0])} <span>${c}</span></h2>${vs.map((t,n)=>`<p><sup>${n+1}</sup>${esc(t)}</p>`).join('')}<p class="src">King James Version</p></article>`;
    body.scrollTop=0;
  }).catch(()=>{
    if(R.i!==i)return;
    if(S.ver!=='KJV')return;
    body.innerHTML=`<div class="r-text">${vseg}<p class="loading">The Bible text didn’t load. Reopen this chapter, or switch to NIV above.</p></div>`;
  });
  renderFoot();
}
function renderFoot(){
  const i=R.i,read=isRead(i),nx=queueNext();
  let main;
  if(!read)main=`<button class="btn primary" data-act="rMark">${nx!==null?'Mark as read, next: '+esc(chName(nx)):'Mark as read'}</button>`;
  else main=nx!==null?`<button class="btn primary" data-act="rGo" data-i="${nx}">Next: ${esc(chName(nx))}</button>`:`<button class="btn primary" data-act="closeReader">Done</button>`;
  $('#rFoot').innerHTML=`<div class="row">${main}</div><div class="meta"><span>${read?'Read'+(S.read[key(i)]!==BEFORE?' on '+fmtDate(S.read[key(i)],{month:'short',day:'numeric'}):''):(R.q?'Part of today’s reading':'Not read yet')}</span>${read?`<button data-act="rUnmark">Mark unread</button>`:`<button data-act="niv">${S.ver==='NIV'?'Open NIV':'Read in NIV'}</button>`}</div>`;
}

/* ---------- sheets, toast, confetti ---------- */
function sheet(html){const el=$('#sheet');$('#sheetBody').innerHTML=html;el.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));}
function closeSheet(){const el=$('#sheet');el.classList.remove('open');setTimeout(()=>{if(!el.classList.contains('open'))el.hidden=true;},230);}
let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}
function confetti(big){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),g=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.hidden=false;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue('--gilt'),cs.getPropertyValue('--gilt-hi'),cs.getPropertyValue('--ribbon'),'#ffffff'];
  const P=range(0,big?220:110).map(()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.4,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now(),dur=big?3200:2000;
  (function f(t){g.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();}
    if(t-t0<dur)requestAnimationFrame(f);else{g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);cv.hidden=true;}})(t0);
}
function celebrate(kind,b,alsoToday){
  if(kind==='today'){confetti(false);toast('Today’s reading is done. See you tomorrow.');return;}
  if(kind==='book'){
    confetti(false);
    const n=doneBooks().length;
    sheet(`<div><h2>You finished ${esc(BOOKS[b][0])}</h2><p class="lede">That’s ${n} of 66 books.${alsoToday?' Today’s reading is done too.':''}</p><button class="btn primary wide" data-act="closeSheet">Keep going</button></div>`);
    return;
  }
  if(kind==='all'){confetti(true);setTimeout(()=>certSheet(true),400);}
}

/* ---------- certificate ---------- */
function drawCert(){
  const W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const serif='"Palatino Linotype","Book Antiqua",Palatino,"Noto Serif","Droid Serif",Georgia,serif';
  const done=!!S.completedOn;
  g.fillStyle='#FBFAF6';g.fillRect(0,0,W,H);
  g.strokeStyle='#A87A1F';g.lineWidth=8;g.strokeRect(44,44,W-88,H-88);g.lineWidth=2;g.strokeRect(68,68,W-136,H-136);
  g.fillStyle='#8C2232';g.beginPath();g.moveTo(W-230,44);g.lineTo(W-176,44);g.lineTo(W-176,250);g.lineTo(W-203,222);g.lineTo(W-230,250);g.closePath();g.fill();
  // little page-edge mark
  let x=W/2-300;for(let bi=0;bi<66;bi++){const w=BOOKS[bi][2]*600/TOTAL;g.fillStyle=bi%2?'#C9A04A':'#A87A1F';g.fillRect(x,150,Math.max(w-1,1),28);x+=w;}
  g.textAlign='center';
  g.fillStyle='#1E2333';g.font=`600 46px ${serif}`;g.fillText('Certificate of Completion',W/2,272);
  g.fillStyle='#5B6170';g.font=`italic 32px ${serif}`;g.fillText('With joy we celebrate that',W/2,372);
  let name=S.name||'A faithful reader',sz=92;g.fillStyle='#1E2333';
  do{g.font=`600 ${sz}px ${serif}`;sz-=4;}while(g.measureText(name).width>W-360&&sz>40);
  g.fillText(name,W/2,486);
  g.strokeStyle='#A87A1F';g.lineWidth=2;g.beginPath();g.moveTo(W/2-360,516);g.lineTo(W/2+360,516);g.stroke();
  g.fillStyle='#1E2333';g.font=`38px ${serif}`;g.fillText(done?'has read the whole Bible':'is reading the whole Bible',W/2,592);
  g.fillStyle='#5B6170';g.font=`30px ${serif}`;g.fillText('66 books and 1,189 chapters, from Genesis to Revelation',W/2,648);
  const began=S.began||S.plan.start;
  g.font=`28px ${serif}`;g.fillText(done?`Started ${fmtDate(began)}      Finished ${fmtDate(S.completedOn)}`:`Started ${fmtDate(began)}      ${readCount().toLocaleString()} chapters so far`,W/2,730);
  g.fillStyle='#1E2333';g.font=`italic 32px ${serif}`;g.fillText('“Thy word is a lamp unto my feet, and a light unto my path.”',W/2,850);
  g.fillStyle='#5B6170';g.font=`26px ${serif}`;g.fillText('Psalm 119:105',W/2,894);
  g.font=`22px ${serif}`;g.fillText('All Glory to God',W/2,1010);
  if(!done){g.save();g.translate(W/2,H/2);g.rotate(-.18);g.fillStyle='rgba(140,34,50,.12)';g.font=`700 150px ${serif}`;g.fillText('PREVIEW',0,50);g.restore();}
  return c;
}
function certSheet(fresh){
  const c=drawCert(),url=c.toDataURL('image/png');
  sheet(`<div><h2>${S.completedOn?(fresh?'You’ve read the whole Bible!':'Your certificate'):'Certificate preview'}</h2>
  <p class="lede">${S.completedOn?'All 66 books, all 1,189 chapters. Save it, print it, or share it with someone who prayed for you.':'Finish all 1,189 chapters and the preview mark comes off.'}</p>
  <img class="cert-prev" src="${url}" alt="Certificate of completion for ${esc(S.name||'you')}">
  <div class="row">${S.completedOn?`<button class="btn primary" data-act="saveCert">Save certificate</button>`:''}<button class="btn ghost" data-act="closeSheet">Close</button></div>${S.name?'':'<p class="fine">Add your name in More so it shows on the certificate.</p>'}</div>`);
}

/* ---------- files ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
function saveFile(fname,mime,data64){
  if(APP){try{const w=AndroidApp.saveFile(data64,fname,mime);toast(w?`Saved to ${w}`:'Couldn’t save the file');}catch(e){toast('Couldn’t save the file');}return;}
  const a=document.createElement('a');a.href=`data:${mime};base64,${data64}`;a.download=fname;document.body.appendChild(a);a.click();a.remove();toast(`Saved ${fname}`);
}
function doImport(text){
  let o;try{o=JSON.parse(text);}catch(e){toast('That file isn’t a Bible Journey backup');return;}
  if(!o||o.app!=='bible-journey'||!o.data||typeof o.data.read!=='object'){toast('That file isn’t a Bible Journey backup');return;}
  const read={};
  for(const [k,v] of Object.entries(o.data.read)){const m=/^(\d+)\.(\d+)$/.exec(k);if(!m)continue;const b=+m[1],c=+m[2];if(b<66&&c>=1&&c<=BOOKS[b][2]&&typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v))read[k]=v;}
  const keepTheme=S.theme;
  S=Object.assign(defaults(),o.data,{read,theme:o.data.theme||keepTheme});
  if(S.plan&&!(S.plan.start&&S.plan.end&&ORDERS.some(x=>x[0]===S.plan.order)))S.plan=null;
  save();syncReminder();closeSheet();tab='today';render();toast(`Restored ${plural(Object.keys(read).length,'chapter')}`);
}
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f);e.target.value='';});

/* ---------- share ---------- */
function shareSheet(which){
  const url=LINKS[which];let svg='';
  try{const q=qrcode(0,'M');q.addData(url);q.make();svg=q.createSvgTag({cellSize:6,margin:2,scalable:true});}catch(e){svg='';}
  sheet(`<div><h2>Share Bible Journey</h2>
  <div class="seg" role="group" aria-label="Which link"><button aria-pressed="${which==='apk'}" data-act="qr" data-v="apk">Android app</button><button aria-pressed="${which==='web'}" data-act="qr" data-v="web">Web app</button></div>
  <div class="qr">${svg}</div><p class="qr-url">${url}</p>
  <div class="row"><button class="btn primary" data-act="shareLink" data-v="${which}">Share link</button><button class="btn ghost" data-act="copyLink" data-v="${which}">Copy link</button><button class="btn ghost" data-act="closeSheet">Close</button></div>
  <p class="fine">${which==='apk'?'Scan with an Android phone camera to download the app. Allow “install unknown apps” when the phone asks.':'Opens in any phone or computer browser. Progress is saved in that browser.'}</p></div>`);
}
function copy(text){
  if(APP){try{AndroidApp.copyText(text);toast('Link copied');return;}catch(e){}}
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('Link copied'),()=>toast(text));
}

/* ---------- plan editor ---------- */
function planSheet(){
  const t=today(),left=TOTAL-readCount();
  sheet(`<div><h2>Reading plan</h2><p class="lede">${plural(left,'chapter')} left. Changing the finish date restarts the pace from today; your ticked chapters stay.</p>
  <fieldset class="field"><legend>Finish</legend>
  ${[['keep','Keep '+fmtDate(S.plan.end),null]].concat(PLANS.map(([v,l])=>[v,'In '+l,+v]),[['custom','Pick a date',null]]).map(([v,l,d],n)=>`<label class="opt"><input type="radio" name="pl-plan" value="${v}"${n===0?' checked':''}><span class="opt-t">${l}</span><span class="opt-s">${d?rateText(left,d):v==='keep'?rateText(left,diffDays(t,S.plan.end)+1):'Choose your own finish date'}</span></label>`).join('')}
  <input type="date" id="pl-date" class="date" min="${addDays(t,1)}" value="${S.plan.end>t?S.plan.end:addDays(t,30)}" hidden aria-label="Finish date">
  </fieldset>
  <fieldset class="field"><legend>Reading order</legend>
  ${ORDERS.map(([v,l,s])=>`<label class="opt"><input type="radio" name="pl-order" value="${v}"${v===S.plan.order?' checked':''}><span class="opt-t">${l}</span><span class="opt-s">${s}</span></label>`).join('')}
  </fieldset>
  <div class="row"><button class="btn primary" data-act="savePlan">Save plan</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`);
}

/* ---------- reminder ---------- */
function syncReminder(){
  if(!APP)return;
  try{if(S.reminder.on){const [h,m]=S.reminder.time.split(':').map(Number);AndroidApp.setReminder(h,m);}else AndroidApp.cancelReminder();}catch(e){}
}

/* ---------- actions ---------- */
function act(a,el){
  const i=el.dataset.i!==undefined?+el.dataset.i:null;
  switch(a){
    case 'start':{
      const t=today(),p=(document.querySelector('input[name=su-plan]:checked')||{}).value||'365';let end;
      if(p==='custom'){end=$('#su-date').value;if(!end||diffDays(t,end)<6){toast('Pick a finish date at least a week away');return;}}
      else end=addDays(t,+p-1);
      S.name=$('#su-name').value.trim();S.ver=(document.querySelector('input[name=su-ver]:checked')||{}).value||'KJV';
      S.plan={start:t,end,order:(document.querySelector('input[name=su-order]:checked')||{}).value||'canonical'};
      S.began=S.began||t;S.completedOn=null;save();go('today');if(pendingJoin){groupJoinSheet(pendingJoin);pendingJoin=null;}break;}
    case 'read':openReader(i,el.dataset.q==='today'?todayPlan().list:null);break;
    case 'markToday':commit(todayPlan().list.filter(x=>!isRead(x)),true);break;
    case 'tick':commit([i],!isRead(i));break;
    case 'testament':testament=el.dataset.v;render();break;
    case 'book':bookOpen=+el.dataset.b;render();window.scrollTo(0,0);break;
    case 'bookBack':bookOpen=null;render();break;
    case 'tickMode':S.tickMode=el.dataset.v;save();render();break;
    case 'bookBefore':{const b=+el.dataset.b;for(let c=1;c<=BOOKS[b][2];c++){const k=b+'.'+c;if(!S.read[k])S.read[k]=BEFORE;}
      if(readCount()===TOTAL&&!S.completedOn){S.completedOn=today();save();render();celebrate('all');break;}
      save();render();toast(`${BOOKS[b][0]} marked as read`);break;}
    case 'bookClear':{const b=+el.dataset.b;sheet(`<div><h2>Clear ${esc(BOOKS[b][0])}?</h2><p class="lede">All ${plural(BOOKS[b][2],'chapter')} go back to unread.</p><div class="row"><button class="btn danger" data-act="bookClearYes" data-b="${b}">Clear book</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`);break;}
    case 'bookClearYes':{const b=+el.dataset.b;closeSheet();commit(range(OFF[b],OFF[b]+BOOKS[b][2]),false);toast(`${BOOKS[b][0]} cleared`);break;}
    case 'closeReader':closeReader();render();break;
    case 'recMenu':if(REC.mr){toast('Already recording. Tap Stop to finish.');break;}sheet(`<div><h2>Record yourself reading</h2><p class="lede">Read aloud while the app records. Keep turning chapters; the recording carries on until you tap Stop.</p><div class="choice"><button data-act="recStart" data-v="audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg><span><b>Audio</b><span>Your voice only. Smaller files.</span></span></button><button data-act="recStart" data-v="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m15.5 10.5 6-3.5v10l-6-3.5z"/></svg><span><b>Video</b><span>Front camera and voice.</span></span></button></div><button class="btn ghost wide" data-act="closeSheet" style="margin-top:8px">Cancel</button></div>`);break;
    case 'recStart':closeSheet();startRec(el.dataset.v);break;
    case 'recPause':pauseRec();break;
    case 'recStop':stopRec();break;
    case 'recList':recListSheet();break;
    case 'recOpen':recPlayer(el.dataset.id);break;
    case 'recSave':recSaveToPhone(el.dataset.id);break;
    case 'recDel':sheet(`<div><h2>Delete this recording?</h2><p class="lede">It can’t be brought back unless you saved it to your phone.</p><div class="row"><button class="btn danger" data-act="recDelYes" data-id="${esc(el.dataset.id)}">Delete</button><button class="btn ghost" data-act="recList">Cancel</button></div></div>`);break;
    case 'recDelYes':recDel(el.dataset.id).then(()=>{toast('Recording deleted');recListSheet();});break;
    case 'gStart':groupStartSheet();break;
    case 'gJoin':groupJoinSheet('');break;
    case 'gCreate':groupCreate();break;
    case 'gJoinGo':groupJoin();break;
    case 'gInvite':groupInvite(el.dataset.g);break;
    case 'gRefresh':loadGroups(true);break;
    case 'member':memberSheet(el.dataset.g,el.dataset.m);break;
    case 'mNudge':{const m=memberOf(el.dataset.g,el.dataset.m);if(!m)break;const txt=`Hi ${m.name}! How’s your Bible reading going? I’m praying for you. Keep going!`;if(APP){try{AndroidApp.shareText(txt);break;}catch(e){}}if(navigator.share)navigator.share({text:txt}).catch(()=>{});else copy(txt);break;}
    case 'mRemove':{const m=memberOf(el.dataset.g,el.dataset.m);sheet(`<div><h2>Remove ${esc(m?m.name:'this member')}?</h2><p class="lede">They leave this group and stop sharing progress with it. They can rejoin with the code.</p><div class="row"><button class="btn danger" data-act="mRemoveYes" data-g="${el.dataset.g}" data-m="${esc(el.dataset.m)}">Remove</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`);break;}
    case 'mRemoveYes':groupRemove(el.dataset.g,el.dataset.m);break;
    case 'gLeave':{const g=S.groups.find(x=>x.code===el.dataset.g);const lead=g&&g.role==='leader';sheet(`<div><h2>${lead?'Close':'Leave'} ${esc(g?g.name:'this group')}?</h2><p class="lede">${lead?'The group and everyone’s shared progress in it are removed. Each person keeps their own reading.':'You stop sharing your progress with this group. Your own reading stays.'}</p><div class="row"><button class="btn danger" data-act="gLeaveYes" data-g="${el.dataset.g}">${lead?'Close group':'Leave group'}</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div></div>`);break;}
    case 'gLeaveYes':groupLeave(el.dataset.g);break;
    case 'gForget':S.groups=S.groups.filter(x=>x.code!==el.dataset.g);save();render();break;
    case 'rPrev':if(R.i>0){R.i--;R.q=null;renderReader();}break;
    case 'rNext':if(R.i<TOTAL-1){R.i++;R.q=null;renderReader();}break;
    case 'rGo':R.i=i;renderReader();break;
    case 'rMark':{const nx=queueNext();commit([R.i],true);if(readCount()===TOTAL){closeReader();break;}if(nx!==null){R.i=nx;renderReader();}else{closeReader();render();}break;}
    case 'rUnmark':commit([R.i],false);renderFoot();break;
    case 'rFont':{const steps=[16,19,22,25,28];S.font=steps[(steps.findIndex(s=>s>=S.font)+1)%steps.length];save();applyTheme();break;}
    case 'yv':openUrl(yvUrl(R.i));break;
    case 'niv':openNiv(R.i);break;
    case 'ver':{S.ver=el.dataset.v==='NIV'?'NIV':'KJV';save();if(!$('#reader').hidden){renderReader();if(S.ver==='NIV'&&APP&&!isRead(R.i))openNiv(R.i);}else render();break;}
    case 'closeSheet':closeSheet();break;
    case 'plan':planSheet();break;
    case 'savePlan':{
      const t=today(),p=document.querySelector('input[name=pl-plan]:checked').value;let end=S.plan.end;
      if(p==='custom'){end=$('#pl-date').value;if(!end||end<=t){toast('Pick a date after today');return;}}
      else if(p!=='keep')end=addDays(t,+p-1);
      if(end!==S.plan.end)S.plan.start=t;
      S.plan.end=end;S.plan.order=document.querySelector('input[name=pl-order]:checked').value;
      save();closeSheet();render();toast('Plan saved');break;}
    case 'theme':S.theme=el.dataset.v;save();render();break;
    case 'export':saveFile(`bible-journey-backup-${today()}.json`,'application/json',b64(JSON.stringify({app:'bible-journey',version:1,saved:new Date().toISOString(),data:S})));break;
    case 'import':$('#importFile').click();break;
    case 'share':shareSheet('apk');break;
    case 'qr':shareSheet(el.dataset.v);break;
    case 'shareLink':{const u=LINKS[el.dataset.v],txt=`Read the whole Bible with me on Bible Journey: ${u}`;
      if(APP){try{AndroidApp.shareText(txt);break;}catch(e){}}
      if(navigator.share)navigator.share({title:'Bible Journey',text:txt}).catch(()=>{});else copy(u);break;}
    case 'copyLink':copy(LINKS[el.dataset.v]);break;

const REC={mr:null,stream:null,chunks:[],kind:null,t0:0,acc:0,paused:false,chapters:[],timer:null,mime:''};
const fmtDur=ms=>{const s=Math.round(ms/1000),m=Math.floor(s/60);return m+':'+pad(s%60);};
function pickMime(kind){
  const list=kind==='video'?['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm','video/mp4']:['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(const m of list){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}
  return '';
}
function chaptersLabel(list){
  if(!list.length)return 'Reading';
  const sorted=[...list].sort((a,b)=>a-b),gs=groups(sorted).map(g=>{const a=FLAT[g.items[0]][1],z=FLAT[g.items[g.items.length-1]][1];return BOOKS[g.b][0]+' '+(a===z?a:a+'–'+z);});
  return gs.length>3?gs.slice(0,3).join(', ')+` and ${gs.length-3} more`:gs.join(', ');
}
function keepAwake(on){
  if(APP){try{AndroidApp.keepAwake(on);}catch(e){}return;}
  try{if(on&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{REC.lock=l;}).catch(()=>{});else if(!on&&REC.lock){REC.lock.release();REC.lock=null;}}catch(e){}
}
async function startRec(kind){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Recording doesn’t work in this browser. Try the Android app or Chrome.');return;}
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia(kind==='video'
      ?{audio:{echoCancellation:true,noiseSuppression:true},video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}}}
      :{audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){toast(kind==='video'?'Allow the camera and microphone to record video':'Allow the microphone to record');return;}
  const mime=pickMime(kind);let mr;
  try{mr=new MediaRecorder(stream,Object.assign(mime?{mimeType:mime}:{},kind==='video'?{videoBitsPerSecond:1200000,audioBitsPerSecond:96000}:{audioBitsPerSecond:96000}));}
  catch(e){stream.getTracks().forEach(t=>t.stop());toast('This phone can’t record in this mode');return;}
  Object.assign(REC,{mr,stream,chunks:[],kind,t0:Date.now(),acc:0,paused:false,chapters:[R.i],mime:mr.mimeType||mime||(kind==='video'?'video/webm':'audio/webm')});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
  mr.onstop=finishRec;
  mr.start(1000);
  if(kind==='video'){const v=$('#recCam');v.srcObject=stream;v.hidden=false;v.play().catch(()=>{});$('#reader').classList.add('cam');}
  $('#recBar').hidden=false;$('#recBar').classList.remove('paused');$('#recPauseBtn').textContent='Pause';
  REC.timer=setInterval(tickRec,500);tickRec();keepAwake(true);
}
function recElapsed(){return REC.acc+(REC.paused?0:Date.now()-REC.t0);}
function tickRec(){if(!REC.mr)return;$('#recTime').textContent=`${REC.paused?'Paused':REC.kind==='video'?'Recording video':'Recording audio'} ${fmtDur(recElapsed())}`;}
function pauseRec(){
  if(!REC.mr)return;
  try{
    if(!REC.paused){REC.mr.pause();REC.acc+=Date.now()-REC.t0;REC.paused=true;$('#recPauseBtn').textContent='Resume';$('#recBar').classList.add('paused');}
    else{REC.mr.resume();REC.t0=Date.now();REC.paused=false;$('#recPauseBtn').textContent='Pause';$('#recBar').classList.remove('paused');}
  }catch(e){toast('Pause isn’t available on this phone');}
  tickRec();
}
function stopRec(){
  if(!REC.mr)return;
  REC.dur=recElapsed();
  try{REC.mr.stop();}catch(e){finishRec();}
}
function finishRec(){
  const r=REC;if(!r.mr)return;
  clearInterval(r.timer);keepAwake(false);
  r.stream&&r.stream.getTracks().forEach(t=>t.stop());
  const v=$('#recCam');v.srcObject=null;v.hidden=true;$('#reader').classList.remove('cam');$('#recBar').hidden=true;
  const blob=new Blob(r.chunks,{type:r.mime.split(';')[0]});
  const rec={id:Date.now().toString(36)+rid(4),created:new Date().toISOString(),kind:r.kind,mime:blob.type,dur:r.dur||recElapsed(),chapters:[...r.chapters],label:chaptersLabel(r.chapters),size:blob.size,blob};
  Object.assign(REC,{mr:null,stream:null,chunks:[],timer:null});
  if(!blob.size){toast('Nothing was recorded');return;}
  recPut(rec).then(()=>{
    toast(`Saved recording: ${rec.label} (${fmtDur(rec.dur)})`);
    if($('#reader').hidden)recPlayer(rec.id);
  }).catch(()=>{
    toast('Not enough space to keep the recording here. Saving it to your phone instead.');
    saveBlob(blob,recFileName(rec));
  });
}

/* ---- recordings storage (IndexedDB, this device only) ---- */
let dbP=null;
function idb(){
  if(!dbP)dbP=new Promise((res,rej)=>{const q=indexedDB.open('bibleJourney',1);q.onupgradeneeded=()=>q.result.createObjectStore('rec',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>{dbP=null;rej(q.error);};});
  return dbP;
}
function tx(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('rec',mode),req=fn(t.objectStore('rec'));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));}
const recPut=r=>tx('readwrite',st=>st.put(r));
const recGet=id=>tx('readonly',st=>st.get(id));
const recDel=id=>tx('readwrite',st=>st.delete(id));
const recAll=()=>tx('readonly',st=>st.getAll()).then(a=>(a||[]).sort((x,y)=>y.created.localeCompare(x.created)));
const extFor=m=>m.includes('mp4')?(m.startsWith('audio')?'m4a':'mp4'):m.includes('ogg')?'ogg':'webm';
const recFileName=r=>`${r.label.replace(/[–,]/g,'-').replace(/[^A-Za-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}-${r.created.slice(0,10)}.${extFor(r.mime)}`;
const ICON_MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>';
const ICON_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m15.5 10.5 6-3.5v10l-6-3.5z"/></svg>';
let playerUrl=null;
function dropPlayer(){if(playerUrl){URL.revokeObjectURL(playerUrl);playerUrl=null;}}

    sheet(`<div><h2>My recordings</h2><p class="lede">${list.length?'Kept on this phone only. Use “Save to phone” to keep a copy in your gallery or music.':'None yet. Open any chapter and tap the microphone at the top to record yourself reading.'}</p>

function blobB64(b){return new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]||'');f.onerror=()=>rej(f.error);f.readAsDataURL(b);});}
async function saveBlob(blob,fname){
  if(APP){
    try{
      const id=AndroidApp.fileStart(fname,blob.type||'application/octet-stream');if(!id)throw 0;
      toast('Saving…');
      const CH=768*1024;
      for(let o=0;o<blob.size;o+=CH){if(!AndroidApp.fileChunk(id,await blobB64(blob.slice(o,o+CH))))throw 0;}
      const w=AndroidApp.fileFinish(id);toast(w?`Saved to ${w}`:'Couldn’t save the file');
    }catch(e){toast('Couldn’t save the file');}
    return;
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);toast(`Saved ${fname}`);

  if(!takeName()){toast('Add your name so your disciples know it’s you');return;}
  try{
    let code;for(let n=0;n<5;n++){code=rid(6);if(await api('GET',`bj/groups/${code}/info`)===null)break;code=null;}
    if(!code)throw 0;
    await api('PUT',`bj/groups/${code}/info`,{name,leader:S.uid,leaderName:S.name,created:{'.sv':'timestamp'}});
    S.groups.push({code,name,role:'leader'});save();await pushNow();
    closeSheet();tab='group';await loadGroups(false);render();groupInvite(code);
  }catch(e){toast('Couldn’t create the group. Check your internet connection.');}
}
async function groupJoin(){
  const code=($('#g-code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){toast('Group codes have 6 characters');return;}
  if(S.groups.some(g=>g.code===code)){toast('You’re already in this group');return;}
  if(!takeName()){toast('Add your name so your group knows it’s you');return;}
  try{
    const info=await api('GET',`bj/groups/${code}/info`);
    if(!info){toast('No group has that code. Check it with your discipler.');return;}
    await api('DELETE',`bj/groups/${code}/removed/${S.uid}`);
    S.groups.push({code,name:info.name||'Group',role:info.leader===S.uid?'leader':'member'});save();await pushNow();
    closeSheet();toast(`You joined ${info.name||'the group'}`);tab='group';bookOpen=null;await loadGroups(true);render();
  }catch(e){toast('Couldn’t join. Check your internet connection.');}
}
function groupInvite(code){
  const g=S.groups.find(x=>x.code===code);if(!g)return;
  const url=`${LINKS.web}?join=${code}`;let svg='';
  try{const q=qrcode(0,'M');q.addData(url);q.make();svg=q.createSvgTag({cellSize:6,margin:2,scalable:true});}catch(e){}
  const txt=`Join my Bible reading group “${g.name}” on Bible Journey.\nGroup code: ${code}\nAndroid app: ${LINKS.apk}\nOr open: ${url}`;
  sheet(`<div><h2>Invite to ${esc(g.name)}</h2><p class="lede">In the app, disciples tap Group, then Join a group, and enter this code.</p>
  <p class="gcode code">${code}</p>
  <div class="qr">${svg}</div><p class="qr-url">Scan to open the web app with the code filled in</p>
  <div class="row"><button class="btn primary" data-act="shareInvite" data-g="${code}">Share invite</button><button class="btn ghost" data-act="closeSheet">Done</button></div></div>`);
  window._invite=txt;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act=shareInvite]');if(!b)return;const txt=window._invite||'';if(APP){try{AndroidApp.shareText(txt);return;}catch(x){}}if(navigator.share)navigator.share({text:txt}).catch(()=>{});else copy(txt);});
async function groupLeave(code){
  const g=S.groups.find(x=>x.code===code);if(!g)return;
  try{if(g.role==='leader')await api('DELETE',`bj/groups/${code}`);else await api('DELETE',`bj/groups/${code}/members/${S.uid}`);}
  catch(e){toast('Couldn’t reach the group. Try again when you’re online.');return;}
  S.groups=S.groups.filter(x=>x.code!==code);delete G[code];save();closeSheet();render();toast(g.role==='leader'?'Group closed':'You left the group');
}
async function groupRemove(code,id){
  try{await api('PUT',`bj/groups/${code}/removed/${id}`,true);await api('DELETE',`bj/groups/${code}/members/${id}`);
    if(G[code]&&G[code].members)delete G[code].members[id];closeSheet();render();toast('Removed from the group');}
  catch(e){toast('Couldn’t reach the group. Try again when you’re online.');}
}

render();
syncReminder();
queuePush();
if(joinParam){if(S.plan)groupJoinSheet(joinParam);else pendingJoin=joinParam;}
</script>
</body>
