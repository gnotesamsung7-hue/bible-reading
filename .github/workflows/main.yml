name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Put the web app inside the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html kjv.json android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BibleJourney.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bible Journey (latest build)
          body: "Latest Bible Journey APK, built from commit ${{ github.sha }}. Install over the old version; your progress stays."
          files: BibleJourney.apk
          make_latest: true
